version: "3.9"
services:
  keycloak_postgres:
    container_name: keycloak_postgres
    image: postgres:16
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8BaA2Tp7WNbXQWwE
      POSTGRES_DB: keycloak
      POSTGRES_HOST: postgres
    networks:
      - vms

  keycloak:
    container_name: keycloak
    build:
      context: .
      args:
        KEYCLOAK_VERSION: 22.0.5
    command: ['start', '--optimized --http-enabled=true --hostname-strict=false --hostname-strict-https=false']
    depends_on:
      - keycloak_postgres
    environment:
      JAVA_OPTS_APPEND: -Dkeycloak.profile.feature.upload_scripts=enabled
      KC_DB_PASSWORD: 8BaA2Tp7WNbXQWwE
      KC_DB_URL: jdbc:postgresql://keycloak_postgres/keycloak
      KC_DB_USERNAME: postgres
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - 8088:8080
    networks:
      - vms

networks:
  vms:
    external: true

volumes:
  postgres_data:

